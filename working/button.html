/* The photo covers the initials rather than replacing them, so a missing file
   degrades to a monogram instead of an empty circle. */
.pf-avatar-photo[data-avatar] { background-size: cover; background-position: center; }
.pf-avatar-photo[data-avatar] > * { visibility: hidden; }

/* People First — page photographs. GENERATED by scripts/build-images-css.mjs.
 * Do not hand-edit; drop images in assets/images/ and re-run the build.

 * A file named hero-pathway.png binds to data-image="hero-pathway". Unlike an avatar,

 * should ever be paired with a real person's record.

/* The slot keeps its declared size whether or not a file exists, so a missing picture
   is a hole of the right shape rather than a collapsed box that hides the gap. */
.pf-image[data-image] { background-size: cover; background-position: center; background-repeat: no-repeat; }

/* Radio card
 * 4 variants captured. 4 variants
 * Figma draws this 235px wide; treated as layout, not a rule
 */
.pf-radio-card {
  height: 152px;
  padding: 25px 0;
  border-radius: 4px;
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 10px;
  appearance: none;
  -webkit-appearance: none;
  background: transparent;
  margin: 0;
  border: 1px solid transparent;
  box-sizing: border-box;
  font-family: var(--pf-font-body);
}
.pf-radio-card[data-selected="No"][data-state="Enabled"] {
  background: var(--pf-bg-primary);
  border-color: var(--pf-border-default-full);
  color: var(--pf-text-primary);
}
.pf-radio-card[data-selected="Yes"][data-state="Enabled"] {
  background: var(--pf-bg-light-theme);
  border-color: var(--pf-border-theme);
  color: var(--pf-text-theme);
}
.pf-radio-card[data-selected="No"][data-state="Disabled"],
.pf-radio-card[data-selected="No"]:disabled,
.pf-radio-card[data-selected="No"][aria-disabled="true"] {
  background: var(--pf-bg-tertiary);
  border-color: var(--pf-border-disabled);
  color: var(--pf-text-disabled);
}
.pf-radio-card[data-selected="Yes"][data-state="Disabled"],
.pf-radio-card[data-selected="Yes"]:disabled,
.pf-radio-card[data-selected="Yes"][aria-disabled="true"] {
  background: var(--pf-bg-tertiary);
  border-color: var(--pf-border-disabled);
  color: var(--pf-text-disabled);
}

/* Radio tile
 * 2 variants captured. 2 variants
 * Figma draws this 235px wide; treated as layout, not a rule
 */
.pf-radio-tile {
  height: 152px;
  padding: 25px 0;
  border-radius: 4px;
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 10px;
  appearance: none;
  -webkit-appearance: none;
  background: transparent;
  margin: 0;
  border: 1px solid transparent;
  box-sizing: border-box;
  font-family: var(--pf-font-body);
}
.pf-radio-tile {
  background: var(--pf-bg-primary);
  border-color: var(--pf-border-default-full);
  color: var(--pf-text-primary);
}
.pf-radio-tile[data-state="Hover"],
.pf-radio-tile:hover {
  background: var(--pf-bg-light-theme);
  border-color: var(--pf-border-theme);
  color: var(--pf-text-theme);
}

/* Repeating group
 * 1 variant captured
 */
.pf-repeating-group {
  height: 258px;
  display: inline-flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: flex-start;
  gap: 20px;
  font-size: 16px;
  appearance: none;
  -webkit-appearance: none;
  background: transparent;
  margin: 0;
  border: 0;
  box-sizing: border-box;
  font-family: var(--pf-font-body);
}
.pf-repeating-group {
  /* Figma records "Grey-slate" as this component's text colour, but its child
     tree binds 4 different label colours — this is one of them;
     promoted to all. Emitting it painted every label alike; the template gives;
     each its own. See docs/FIGMA-ISSUES.md section 9. */;
}

  display: inline-flex;
  flex-direction: row;
  align-items: center;
  justify-content: flex-start;
  gap: 8px;

/* Focus — browser behaviour, not a Figma variant. Two-tone: no single colour in
 * the palette reaches 3:1 against every surface (best 1.41:1). Each half is
 * invisible where the other carries, so one always reads. See dsskill DEF-0003. */
:root {
  --pf-border-focus-inner: var(--pf-text-always-white);
  --pf-border-focus-outer: var(--pf-base-blue-shark);
}
:focus-visible {
  outline: 2px solid var(--pf-border-focus-outer);
  outline-offset: 2px;
  box-shadow: 0 0 0 2px var(--pf-border-focus-inner);
}

/* A component used as a table CONTAINER has to be able to be narrower than its
   contents; hug-contents is a Figma canvas behaviour, not a page one. */
.pf-table-ag {
  display: flex;
  width: 100%;
  min-width: 0;
  max-width: 100%;
  align-items: stretch;
}
.pf-table-ag > * { min-width: 0; max-width: 100%; width: 100%; }
.pf-table-ag td, .pf-table-ag tbody { font-weight: var(--pf-font-weight-regular); }

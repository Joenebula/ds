<!-- Repeating group — generated from Figma by scripts/build-templates.mjs.
     The outer element is the component's own class; everything inside is its Figma
     child tree. Do not hand-edit: regenerate with npm run build. -->
<div class="pf-repeating-group">
  <!-- Context (FRAME) is here in Figma and switched OFF -->
  <span style="color:var(--pf-text-primary);font-size:16px;font-weight:600">Item 1</span><!-- 16px SemiBold is not a text style; see FIGMA-ISSUES.md section 7 -->
  <div style="display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:20px;padding:10px 10px 10px 10px"><!-- SLOT: Figma marks this as where the component's content goes. -->
    <div class="pf-form-field" data-input-type="Text" data-state="Default" data-full-width="Yes" style="width:100%;box-sizing:border-box">Form field</div><!-- sized as Figma draws it HERE: Form field is 460x69 inside Repeating group, not the Form field artboard its class states. -->
    <div class="pf-form-field" data-input-type="Text" data-state="Default" data-full-width="Yes" style="width:100%;box-sizing:border-box">Form field</div><!-- sized as Figma draws it HERE: Form field is 460x69 inside Repeating group, not the Form field artboard its class states. -->
  </div>
  <div style="width:100%;box-sizing:border-box;display:flex;flex-direction:row;align-items:center;justify-content:space-between"><!-- states its width: space-between distributes the SLACK, and a frame sized to its content has none. -->
    <span style="color:var(--pf-text-link);font-size:13px">Add another</span><!-- 13px Regular is not a text style; see FIGMA-ISSUES.md section 7 -->
    <span style="color:var(--pf-text-negative);font-size:13px">Remove</span><!-- 13px Regular is not a text style; see FIGMA-ISSUES.md section 7 -->
  </div>
  <!-- Aprovers (FRAME) is here in Figma and switched OFF -->
</div>

     child tree. Do not hand-edit: regenerate with npm run build. -->

  <div>
    <span class="pf-text-label-text" style="color:var(--pf-text-primary)">50</span>
  </div>
  <div>
    <div style="background:var(--pf-chart-7);min-height:200px;align-self:stretch"></div>
    <div style="background:var(--pf-chart-7);min-height:200px;align-self:stretch"></div>
    <span class="pf-text-large-heading" style="color:var(--pf-text-primary)">0</span>
  </div>
  <div>
    <span class="pf-text-label-text" style="color:var(--pf-text-primary)">0</span>
    <span class="pf-text-label-text" style="color:var(--pf-text-primary)">100</span>
  </div>
</div>

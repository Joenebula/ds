<!-- Percentage bar — generated from Figma by scripts/build-templates.mjs.
     The outer element is the component's own class; everything inside is its Figma
     child tree. Do not hand-edit: regenerate with npm run build. -->
<div class="pf-percentage-bar">
  <div style="display:flex;flex-direction:row;align-items:flex-start;justify-content:space-between">
    <div style="display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:5px">
      <span class="pf-text-label-text" style="color:var(--pf-text-primary)">Percentage b</span>
      <!--pf-icon:dashboard-star 16-->
    </div>
    <div style="display:flex;flex-direction:row;align-items:center;justify-content:flex-end">
      <span class="pf-text-label-text-semibold" style="color:var(--pf-text-primary)">0</span>
      <span class="pf-text-label-text-semibold" style="color:var(--pf-text-primary)">%</span>
    </div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:10px;border-radius:100px;background:var(--pf-bg-tertiary)">
    <div style="border-radius:100px;background:var(--pf-chart-1);min-height:14px;align-self:stretch"></div>
  </div>
</div>

<!-- Hemisphere chart — generated from Figma by scripts/build-templates.mjs.
     The outer element is the component's own class; everything inside is its Figma
     child tree. Do not hand-edit: regenerate with npm run build. -->
<div class="pf-hemisphere-chart">
  <div style="position:relative;width:200px;height:18px;box-sizing:border-box">
    <span class="pf-text-label-text" style="position:absolute;left:0px;top:0px;width:200px;height:18px;box-sizing:border-box;color:var(--pf-text-primary)">50</span>
  </div>
  <div style="position:relative;width:200px;height:100px;box-sizing:border-box">
    <div style="position:absolute;left:0px;top:0px;width:200px;height:200px;box-sizing:border-box;background:var(--pf-chart-7);min-height:200px;align-self:stretch"></div>
    <div style="position:absolute;left:0px;top:0px;width:200px;height:200px;box-sizing:border-box;background:var(--pf-chart-7);min-height:200px;align-self:stretch"></div>
    <span class="pf-text-large-heading" style="position:absolute;left:93px;top:74px;width:14px;height:33px;box-sizing:border-box;color:var(--pf-text-primary)">0</span>
  </div>
  <div style="position:relative;width:200px;height:18px;box-sizing:border-box">
    <span class="pf-text-label-text" style="position:absolute;left:0px;top:0px;width:8px;height:18px;box-sizing:border-box;color:var(--pf-text-primary)">0</span>
    <span class="pf-text-label-text" style="position:absolute;left:176px;top:0px;width:23px;height:18px;box-sizing:border-box;color:var(--pf-text-primary)">100</span>
  </div>
</div>

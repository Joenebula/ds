<!-- Notification card — generated from Figma by scripts/build-templates.mjs.
     The outer element is the component's own class; everything inside is its Figma
     child tree. Do not hand-edit: regenerate with npm run build. -->
<div class="pf-notification-card">
  <div class="pf-notification-image" data-type="Person" data-with-status="True" data-mobile="False" data-status-position="High"></div><!-- Notification image -->
  <div class="pf-checkbox-radio-item" data-state="Default" data-radio="No" data-filled="No" style="width:23px;height:23px;box-sizing:border-box"></div><!-- sized as Figma draws it HERE: Checkbox/Radio item is 23x23 inside Notification card, not the Checkbox/Radio item artboard its class states. --><!-- Checkbox/Radio item -->
  <div style="display:flex;flex-direction:row;align-items:center;justify-content:center;gap:10px;padding:10px 10px 10px 10px;border-radius:100px;background:var(--pf-bg-negative-button)">
    <!--pf-icon:warning 34-->
  </div>
  <div style="display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:10px">
    <div style="display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:5px">
      <div style="display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:10px">
        <span class="pf-text-body-text-semibold" style="color:var(--pf-text-primary)">Title</span>
        <span class="pf-text-body-text" style="color:var(--pf-text-secondary)">8 Sep</span>
        <span class="pf-text-body-text" style="color:var(--pf-text-secondary)">10:03</span>
      </div>
      <span class="pf-text-body-text" style="color:var(--pf-text-primary)">Example noti</span>
    </div>
    <div class="pf-tags" data-type="Warning" data-small="No" style="width:82px;box-sizing:border-box"></div><!-- sized as Figma draws it HERE: Tags is 82x28 inside Notification card, not the Tags artboard its class states. --><!-- Tags -->
  </div>
  <div style="display:flex;flex-direction:row;align-items:flex-start;justify-content:flex-start;gap:8px">
    <div>
      <div style="border-radius:50%;box-shadow:inset 0 0 0 1px var(--pf-icon-secondary);min-height:32px;width:32px"></div>
      <!--pf-icon:up-arrow 36-->
    </div>
    <div>
      <div style="border-radius:50%;box-shadow:inset 0 0 0 1px var(--pf-icon-secondary);min-height:32px;width:32px"></div>
      <!-- Close x: detached from the Figma page tree, so the library has no class for it — see uncaptured-reasons.tsv -->
    </div>
  </div>
</div>

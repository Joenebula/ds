<!-- Side filter — generated from Figma by scripts/build-templates.mjs.
     The outer element is the component's own class; everything inside is its Figma
     child tree. Do not hand-edit: regenerate with npm run build. -->
<div class="pf-side-filter">
  <div style="display:flex;flex-direction:row;align-items:center;justify-content:center;gap:134px;padding:10px 15px 10px 15px;background:var(--pf-bg-primary);border:1px solid var(--pf-border-default-full)">
    <span class="pf-text-sub-heading" style="color:var(--pf-text-primary)">Filter</span>
    <div><!-- 3 drawings here in Figma — vector paths, which no markup can carry. Artwork belongs in assets/component-art/, not in a template. --></div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:30px;padding:20px 20px 20px 20px;background:var(--pf-bg-primary)">
    <span style="color:var(--pf-text-secondary);font-size:16px">Content here</span><!-- 16px Italic is not a text style; see FIGMA-ISSUES.md section 7 -->
  </div>
  <div style="display:flex;flex-direction:row;align-items:flex-start;justify-content:flex-start;gap:10px;padding:10px 15px 10px 15px;background:var(--pf-bg-primary)">
    <div class="pf-button" data-type="Positive" data-state="Default" data-label="Yes">Button</div>
    <div class="pf-button" data-type="Hollow" data-state="Default" data-label="Yes">Button</div>
  </div>
</div>

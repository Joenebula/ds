<!-- Notification list — generated from Figma by scripts/build-templates.mjs.
     The outer element is the component's own class; everything inside is its Figma
     child tree. Do not hand-edit: regenerate with npm run build. -->
<div class="pf-notification-list">
  <div style="display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start">
    <div style="display:flex;flex-direction:row;align-items:center;justify-content:space-between;padding:20px 20px 0px 40px">
      <div style="display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:10px">
        <div class="pf-control" data-radio="No"></div><!-- Control -->
        <div style="display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:5px">
          <span class="pf-text-body-text" style="color:var(--pf-text-primary)">Select all</span>
          <div style="display:flex;flex-direction:row;align-items:flex-start;justify-content:flex-start;gap:10px"><!-- 1 child here in Figma that this walk did not reach (depth limit). Not an empty container — open the component in Figma before filling it. --></div>
        </div>
        <!--pf-icon:tooltip-question-->
      </div>
      <div class="pf-button" data-type="Filter" data-state="Default" data-label="Yes">Button</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:15px;padding:20px 20px 20px 20px"><!-- SLOT: Figma marks this as where the component's content goes. -->
      <div class="pf-notification-card" data-mobile="No">Notification card</div>
      <div class="pf-notification-card" data-mobile="No">Notification card</div>
    </div>
  </div>
</div>

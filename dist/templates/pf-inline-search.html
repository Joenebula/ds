<!-- Inline search — generated from Figma by scripts/build-templates.mjs.
     The outer element is the component's own class; everything inside is its Figma
     child tree. Do not hand-edit: regenerate with npm run build. -->
<div class="pf-inline-search">
  <div class="pf-field-label" style="width:100%;box-sizing:border-box">Field label</div><!-- sized as Figma draws it HERE: Field label is 400x22 inside Inline search, not the Field label artboard its class states. -->
  <div style="display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:12px;padding:12px 20px 12px 20px;background:var(--pf-bg-secondary)">
    <span class="pf-text-label-text" style="color:var(--pf-text-primary)">No items add</span>
    <div class="pf-form-field" data-input-type="Search" data-state="Default" data-full-width="Yes" style="width:100%;box-sizing:border-box">Form field</div><!-- sized as Figma draws it HERE: Form field is 360x42 inside Inline search, not the Form field artboard its class states. -->
  </div>
</div>

<!-- Configuration panel — generated from Figma by scripts/build-templates.mjs.
     The outer element is the component's own class; everything inside is its Figma
     child tree. Do not hand-edit: regenerate with npm run build. -->
<div class="pf-configuration-panel">
  <div style="display:flex;flex-direction:row;align-items:center;justify-content:center;gap:10px;padding:20px 0px 20px 0px;border-radius:8px;background:var(--pf-bg-primary)">
    <div style="display:flex;flex-direction:row;align-items:center;justify-content:center;gap:30px">
      <div><!-- 30 drawings here in Figma — vector paths, which no markup can carry. Artwork belongs in assets/component-art/, not in a template. --></div>
      <div style="display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:10px">
        <span class="pf-text-sub-heading" style="color:var(--pf-text-theme)">Configuratio</span>
        <span class="pf-text-label-text" style="color:var(--pf-text-primary)">Define and m</span>
      </div>
    </div>
  </div>
  <div style="height:1px;align-self:stretch;background:var(--pf-border-default-full)"></div>
</div>

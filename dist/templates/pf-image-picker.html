<!-- Image picker — generated from Figma by scripts/build-templates.mjs.
     The outer element is the component's own class; everything inside is its Figma
     child tree. Do not hand-edit: regenerate with npm run build. -->
<div class="pf-image-picker">
  <div style="display:flex;flex-direction:row;align-items:center;justify-content:flex-end;gap:5px;padding:5px 5px 5px 5px">
    <div style="position:relative;width:36px;height:36px;box-sizing:border-box;border-radius:38px;background:var(--pf-icon-secondary)">
      <span style="position:absolute;left:3px;top:3px;width:30px;height:30px;box-sizing:border-box"><!--pf-icon:camera 30--></span>
    </div>
    <div style="position:relative;width:36px;height:36px;box-sizing:border-box;border-radius:38px;background:var(--pf-icon-secondary)">
      <span style="position:absolute;left:3px;top:3px;width:30px;height:30px;box-sizing:border-box"><!--pf-icon:bin-delete 30--></span>
    </div>
  </div>
  <div><!-- 5 drawings here in Figma — vector paths, which no markup can carry. Artwork belongs in assets/component-art/, not in a template. --></div>
</div>

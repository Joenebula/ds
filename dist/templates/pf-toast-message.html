<!-- Toast message — generated from Figma by scripts/build-templates.mjs.
     The outer element is the component's own class; everything inside is its Figma
     child tree. Do not hand-edit: regenerate with npm run build. -->
<div class="pf-toast-message">
  <!-- Tick in circle: detached from the Figma page tree, so the library has no class for it — see uncaptured-reasons.tsv -->
  <div style="display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:10px">
    <span class="pf-text-label-text" style="color:var(--pf-base-grey-slate)">Example text: You ha</span>
  </div>
  <!-- Close x: detached from the Figma page tree, so the library has no class for it — see uncaptured-reasons.tsv -->
  <div style="background:var(--pf-border-positive)"></div>
</div>

<!-- Radio card — generated from Figma by scripts/build-templates.mjs.
     The outer element is the component's own class; everything inside is its Figma
     child tree. Do not hand-edit: regenerate with npm run build. -->
<div class="pf-radio-card">
  <div class="pf-circle-icons" data-size="L - 52px">Circle icons</div>
  <div style="display:flex;flex-direction:column;align-items:center;justify-content:flex-start">
    <span class="pf-text-body-text-semibold" style="color:var(--pf-text-primary)">Title text</span>
    <span class="pf-text-label-text" style="color:var(--pf-text-secondary)">Description </span>
  </div>
  <div style="display:flex;flex-direction:row;align-items:center;justify-content:center;gap:10px;padding:3px 3px 3px 3px;border-radius:50px;background:var(--pf-icon-theme)">
    <!--pf-icon:tick 16-->
  </div>
</div>

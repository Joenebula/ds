<!-- Accordion — generated from Figma by scripts/build-templates.mjs.
     The outer element is the component's own class; everything inside is its Figma
     child tree. Do not hand-edit: regenerate with npm run build. -->
<div class="pf-accordion">
  <div style="display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:10px">
    <!--pf-icon:right-chevron 22-->
    <div class="pf-circle-icons" data-size="M - 44px">Circle icons</div>
    <span class="pf-text-sub-heading" style="color:var(--pf-text-primary)">Text here</span>
  </div>
  <div style="display:flex;flex-direction:row;align-items:center;justify-content:flex-end;gap:20px">
    <div class="pf-tags" data-type="Positive" data-small="No">Tags</div>
    <div class="pf-button" data-type="Action" data-state="Default" data-label="Yes">Button</div>
    <!-- Tick in circle: detached from the Figma page tree, so the library has no class for it — see uncaptured-reasons.tsv -->
  </div>
</div>

<!-- Table action bar — generated from Figma by scripts/build-templates.mjs.
     The outer element is the component's own class; everything inside is its Figma
     child tree. Do not hand-edit: regenerate with npm run build. -->
<div class="pf-table-action-bar">
  <div style="display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:20px;overflow-x:auto"><!-- SLOT: Figma marks this as where the component's content goes. -->
    <div class="pf-filter-chip" data-state="Selected" data-active="True" data-mobile="False">Filter chip</div>
    <div class="pf-filter-chip" data-state="Default" data-active="False" data-mobile="False">Filter chip</div>
    <div class="pf-filter-chip" data-state="Default" data-active="False" data-mobile="False">Filter chip</div>
  </div>
  <div style="display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:20px">
    <div style="display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:10px">
      <div class="pf-primary-search" data-darkmode="False" data-icon-only="False">Primary search</div>
      <div style="display:flex;flex-direction:row;align-items:center;justify-content:center;gap:5px">
        <span class="pf-text-label-text-semibold" style="color:var(--pf-text-primary)">Last refresh</span>
        <span class="pf-text-label-text" style="color:var(--pf-text-primary)">hh:mm</span>
        <span class="pf-text-label-text" style="color:var(--pf-text-primary)">dd/mm/yyyy</span>
      </div>
    </div>
    <div style="display:flex;flex-direction:row;align-items:center;justify-content:flex-end;gap:10px">
      <div class="pf-button" data-type="Hollow" data-state="Default" data-label="Yes">Button</div>
      <div class="pf-button" data-type="Action" data-state="Default" data-label="Yes">Button</div>
    </div>
  </div>
</div>

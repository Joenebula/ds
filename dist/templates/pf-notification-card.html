     child tree. Do not hand-edit: regenerate with npm run build. -->

  <div style="display:flex;flex-direction:row;align-items:center;justify-content:center;gap:10px;padding:10px 10px 10px 10px;border-radius:100px;background:var(--pf-bg-negative-button)">

  </div>
  <div style="display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:10px">
    <div style="display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:5px"></div>
    <div class="pf-tags" data-type="Warning" data-small="No">Tags</div>
  </div>
  <div style="display:flex;flex-direction:row;align-items:flex-start;justify-content:flex-start;gap:8px">
    <div></div>
    <div></div>
  </div>
</div>

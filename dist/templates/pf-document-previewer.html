<!-- Document previewer — generated from Figma by scripts/build-templates.mjs.
     The outer element is the component's own class; everything inside is its Figma
     child tree. Do not hand-edit: regenerate with npm run build. -->
<div class="pf-document-previewer">
  <div style="display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:10px;padding:10px 10px 10px 10px;background:var(--pf-bg-tertiary);border:1px solid var(--pf-border-default-full)">
    <div style="display:flex;flex-direction:row;align-items:center;justify-content:center;gap:10px">
      <span class="pf-text-body-text" style="color:var(--pf-text-primary)">Example of t</span>
    </div>
    <!--pf-icon:download 24-->
  </div>
  <div style="display:flex;flex-direction:row;align-items:flex-start;justify-content:center;gap:10px;padding:20px 20px 20px 20px;background:var(--pf-bg-primary);min-height:550px;align-self:stretch"><!-- 1 drawing here in Figma — vector paths, which no markup can carry. Artwork belongs in assets/component-art/, not in a template. --></div>
  <div style="display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:307px;padding:10px 10px 10px 10px;background:var(--pf-bg-tertiary);border:1px solid var(--pf-border-default-full)">
    <div style="display:flex;flex-direction:row;align-items:center;justify-content:flex-start">
      <div style="display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:10px">
        <div style="display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:10px">
          <!--pf-icon:zoom-out 24-->
          <!--pf-icon:zoom-in 24-->
        </div>
      </div>
    </div>
    <div class="pf-switcher" data-property-1="Default">Switcher</div>
  </div>
</div>

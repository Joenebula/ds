<!-- Org chart — generated from Figma by scripts/build-templates.mjs.
     The outer element is the component's own class; everything inside is its Figma
     child tree. Do not hand-edit: regenerate with npm run build. -->
<div class="pf-org-chart">
  <div style="display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start">
    <div style="display:flex;flex-direction:row;align-items:center;justify-content:flex-start;background:var(--pf-org-card-bg-main)">
      <div style="display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:10px;padding:2px 5px 2px 5px;background:var(--pf-org-card-bg-light)">
        <!--pf-icon:organisation-company 44-->
      </div>
      <div style="display:flex;flex-direction:row;align-items:center;justify-content:center;gap:10px;padding:0px 5px 0px 0px">
        <div style="min-height:55px;width:55px"></div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:0px 0px 0px 5px">
        <span class="pf-text-body-text" style="color:var(--pf-text-primary)">Name</span>
        <span class="pf-text-label-text" style="color:var(--pf-text-secondary)">Role</span>
      </div>
    </div>
    <div style="display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:10px;padding:10px 0px 10px 10px">
      <span class="pf-text-body-text-semibold" style="color:var(--pf-text-primary)">Department</span>
    </div>
  </div>
  <div style="display:flex;flex-direction:row;align-items:center;justify-content:center;gap:10px;padding:5px 3px 5px 3px;background:var(--pf-org-card-bg-dark)">
    <!--pf-icon:add-plus 20-->
  </div>
</div>

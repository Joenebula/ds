<!-- single layout card — generated from Figma by scripts/build-templates.mjs.

     child tree. Do not hand-edit: regenerate with npm run build. -->
<div class="pf-single-layout-card">
  <div style="width:100%;box-sizing:border-box;display:flex;flex-direction:row;align-items:center;justify-content:space-between"><!-- states its width: space-between distributes the SLACK, and a frame sized to its content has none. -->

      <div class="pf-button" data-type="Hollow" data-state="Default" data-label="Yes">Button</div>
      <!--pf-icon:context-menu 28-->
    </div>
  </div>
  <div style="display:flex;flex-direction:row;align-items:flex-end;justify-content:flex-start;gap:30px">

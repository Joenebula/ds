<!-- Editable list card — generated from Figma by scripts/build-templates.mjs.
     The outer element is the component's own class; everything inside is its Figma
     child tree. Do not hand-edit: regenerate with npm run build. -->
<div class="pf-editable-list-card">
  <div style="display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:10px;padding:20px 20px 20px 20px;background:var(--pf-bg-primary);border:1px solid var(--pf-border-default-hidden)">
    <div style="display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:2px">
      <span class="pf-text-label-text" style="color:var(--pf-text-secondary)">Title</span>
      <span class="pf-text-body-text" style="color:var(--pf-text-primary)">Content here</span>
    </div>
  </div>
  <div style="display:flex;flex-direction:row;align-items:center;justify-content:center;gap:16px">
    <div class="pf-button" data-type="Hollow" data-state="Default" data-label="No"></div><!-- Button -->
  </div>
</div>

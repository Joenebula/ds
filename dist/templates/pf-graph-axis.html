<!-- Graph axis — generated from Figma by scripts/build-templates.mjs.
     The outer element is the component's own class; everything inside is its Figma
     child tree. Do not hand-edit: regenerate with npm run build. -->
<div class="pf-graph-axis">
  <div style="display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between">
    <span class="pf-text-label-text" style="color:var(--pf-text-primary)">400</span>
    <span class="pf-text-label-text" style="color:var(--pf-text-primary)">300</span>
    <span class="pf-text-label-text" style="color:var(--pf-text-primary)">200</span>
    <span class="pf-text-label-text" style="color:var(--pf-text-primary)">100</span>
    <span class="pf-text-label-text" style="color:var(--pf-text-primary)">0</span>
  </div>
  <div style="display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:0px 0px 0px 1px;border:1px solid var(--pf-border-form-input)">
    <div style="height:1px;align-self:stretch;background:var(--pf-border-default-full)"></div>
    <div style="height:1px;align-self:stretch;background:var(--pf-border-default-full)"></div>
    <div style="height:1px;align-self:stretch;background:var(--pf-border-default-full)"></div>
    <div style="height:1px;align-self:stretch;background:var(--pf-border-default-full)"></div>
    <div style="height:1px;align-self:stretch;background:var(--pf-border-default-full)"></div>
  </div>
</div>

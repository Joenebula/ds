<!-- Spotlight Card — generated from Figma by scripts/build-templates.mjs.
     The outer element is the component's own class; everything inside is its Figma
     child tree. Do not hand-edit: regenerate with npm run build. -->
<div class="pf-spotlight-card">
  <div style="display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:10px">
    <div style="background:var(--pf-bg-theme);min-height:170px;align-self:stretch"></div>
    <div class="pf-content" style="height:64px;box-sizing:border-box">Content</div><!-- sized as Figma draws it HERE: Content is 375x64 inside Spotlight Card, not the Content artboard its class states. -->
    <div class="pf-floaters"></div><!-- Floaters -->
  </div>
  <div class="pf-footer" style="height:38px;box-sizing:border-box">Footer</div><!-- sized as Figma draws it HERE: Footer is 375x38 inside Spotlight Card, not the Footer artboard its class states. -->
</div>

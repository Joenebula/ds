<!-- Metric card — generated from Figma by scripts/build-templates.mjs.
     The outer element is the component's own class; everything inside is its Figma
     child tree. Do not hand-edit: regenerate with npm run build. -->
<div class="pf-metric-card">
  <div style="display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:10px">
    <span class="pf-text-xl-heading" style="color:var(--pf-text-primary)">10%</span>
    <div class="pf-data-variance" data-data-change="Down" data-mobile="False">Data variance</div>
  </div>
  <span style="color:var(--pf-text-link);font-size:13px">More details</span><!-- 13px is not a text style; see FIGMA-ISSUES.md section 7 -->
</div>

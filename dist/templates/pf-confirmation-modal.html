<!-- Confirmation modal — generated from Figma by scripts/build-templates.mjs.
     The outer element is the component's own class; everything inside is its Figma
     child tree. Do not hand-edit: regenerate with npm run build. -->
<div class="pf-confirmation-modal">
  <div style="display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:25px">
    <div>
      <div></div>
      <div style="background:var(--pf-icon-warning);min-height:101px;width:101px"></div>
      <div style="background:var(--pf-icon-warning);min-height:28px;width:8px"></div>
      <div style="background:var(--pf-icon-warning);min-height:8px;width:8px"></div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px">
      <span class="pf-text-large-heading" style="color:var(--pf-text-primary)">Are you sure</span>
      <span class="pf-text-body-text" style="color:var(--pf-text-primary)">Once closed </span>
    </div>
    <div style="display:flex;flex-direction:row;align-items:flex-start;justify-content:flex-start;gap:25px">
      <div class="pf-button" data-type="Hollow" data-state="Default" data-label="Yes">Button</div>
      <div class="pf-button" data-type="Hollow" data-state="Default" data-label="Yes">Button</div>
    </div>
  </div>
  <!-- Close x: detached from the Figma page tree, so the library has no class for it — see uncaptured-reasons.tsv -->
</div>

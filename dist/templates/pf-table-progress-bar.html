<!-- Table progress bar — generated from Figma by scripts/build-templates.mjs.
     The outer element is the component's own class; everything inside is its Figma
     child tree. Do not hand-edit: regenerate with npm run build. -->
<div class="pf-table-progress-bar">
  <div style="display:flex;flex-direction:row;align-items:flex-start;justify-content:flex-start;border-radius:50px;background:var(--pf-bg-secondary);border:1px solid var(--pf-progress-bar-border)"><!-- packs to the START: Figma's only child here measures zero on this axis, so its centre is unfalsifiable — a real one goes at the start. -->
    <div style="background:var(--pf-chart-4);min-height:14px;align-self:stretch"></div>
  </div>
  <div style="display:flex;flex-direction:row;align-items:center;justify-content:flex-end">
    <span class="pf-text-label-text" style="color:var(--pf-text-primary)">0</span>
    <span class="pf-text-label-text" style="color:var(--pf-text-primary)">%</span>
  </div>
</div>

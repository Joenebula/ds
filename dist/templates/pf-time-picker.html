<!-- Time picker — generated from Figma by scripts/build-templates.mjs.
     The outer element is the component's own class; everything inside is its Figma
     child tree. Do not hand-edit: regenerate with npm run build. -->
<div class="pf-time-picker">
  <div style="display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;border-radius:4px">
    <div style="display:flex;flex-direction:row;align-items:center;justify-content:center;gap:10px;padding:9px 10px 9px 10px">
      <span style="font-size:16px">Time</span><!-- 16px is not a text style; see FIGMA-ISSUES.md section 7 --><!-- Figma colours this "Base colours/White" against a surface it fills with a raw primitive. Dropping the surface (it cannot do dark mode) would leave this text invisible, so the colour is left to inherit. Give the surface a semantic token in Figma. -->
    </div>
    <div style="display:flex;flex-direction:row;align-items:center;justify-content:center;gap:10px;padding:10px 10px 10px 10px;background:var(--pf-bg-tertiary)">
      <div style="display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:6px">
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:space-between">
          <!--pf-icon:up-chevron 22-->
          <span style="color:var(--pf-text-primary);font-size:20px">10</span><!-- 20px Regular is not a text style; see FIGMA-ISSUES.md section 7 -->
          <!--pf-icon:up-chevron 22-->
        </div>
        <span style="color:var(--pf-text-primary);font-size:20px">:</span><!-- 20px Regular is not a text style; see FIGMA-ISSUES.md section 7 -->
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:space-between">
          <!--pf-icon:up-chevron 22-->
          <span style="color:var(--pf-text-primary);font-size:20px">56</span><!-- 20px Regular is not a text style; see FIGMA-ISSUES.md section 7 -->
          <!--pf-icon:up-chevron 22-->
        </div>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;justify-content:flex-start;gap:10px;padding:10px 10px 10px 10px;background:var(--pf-bg-tertiary);border:1px solid var(--pf-border-secondary)">
      <div class="pf-button" data-type="Hollow" data-state="Default" data-label="Yes">Button</div>
    </div>
  </div>
</div>

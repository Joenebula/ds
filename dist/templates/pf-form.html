<!-- Form — generated from Figma by scripts/build-templates.mjs.
     The outer element is the component's own class; everything inside is its Figma
     child tree. Do not hand-edit: regenerate with npm run build. -->
<div class="pf-form">
  <span class="pf-text-sub-heading" style="color:var(--pf-text-primary)">Subheading</span>
  <div style="display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:30px"><!-- SLOT: Figma marks this as where the component's content goes. -->
    <div class="pf-required-field" style="width:100%;box-sizing:border-box">Required field</div><!-- sized as Figma draws it HERE: Required field is 335x22 inside Form, not the Required field artboard its class states. -->

    <div style="display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:10px">
      <div class="pf-field-label">Field label</div>
      <div class="pf-toggle" data-on="No" data-locked="No">Toggle</div>
    </div>
    <div class="pf-form-field" data-input-type="Date picker" data-state="Default" data-full-width="Yes" style="width:100%;box-sizing:border-box">Form field</div><!-- sized as Figma draws it HERE: Form field is 335x69 inside Form, not the Form field artboard its class states. -->
    <div class="pf-text-template-format-editor" data-type="Modal" style="width:100%;box-sizing:border-box">Text template format editor </div><!-- sized as Figma draws it HERE: Text template format editor  is 335x246 inside Form, not the Text template format editor  artboard its class states. -->

  </div>
  <div style="display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:10px">
    <div class="pf-button" data-type="Positive" data-state="Default" data-label="Yes" style="width:100%;box-sizing:border-box">Button</div><!-- sized as Figma draws it HERE: Button is 335x32 inside Form, not the Button artboard its class states. -->
    <div class="pf-button" data-type="Hollow" data-state="Default" data-label="Yes" style="width:100%;box-sizing:border-box">Button</div><!-- sized as Figma draws it HERE: Button is 335x32 inside Form, not the Button artboard its class states. -->
    <div class="pf-button" data-type="Negative" data-state="Default" data-label="Yes" style="width:100%;box-sizing:border-box">Button</div><!-- sized as Figma draws it HERE: Button is 335x32 inside Form, not the Button artboard its class states. -->
  </div>
</div>

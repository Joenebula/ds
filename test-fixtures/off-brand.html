<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Off-brand fixture</title>
<style>
  /* Deliberately NOT People First — used to prove the auditor catches real problems. */
  body { margin:0; padding:24px; background:#ffffff; color:#333333; font-family: Inter, system-ui, sans-serif; }
  .card { background:#f7f7f9; border:1px solid #dddddd; border-radius:12px; padding:16px; margin-bottom:16px; }
  .btn { background:#5b6ef5; color:#ffffff; border:none; border-radius:6px; padding:10px 18px; font-size:15px; }
  .btn-danger { background:#e5484d; color:#ffffff; }
  .muted { color:#adadad; }            /* too light on white — should fail contrast */
  .badge { background:#fff4cc; color:#c9a227; padding:2px 8px; border-radius:4px; } /* low contrast */
  a { color:#7a86f7; }                  /* low contrast link */
</style></head>
<body>
  <div class="card">
    <h1 style="font-size:20px;margin:0 0 8px">Quarterly summary</h1>
    <p class="muted">Last updated 12 March</p>
    <p>Body copy that is fine, plus a <a href="#">link that is too pale</a>.</p>
    <span class="badge">Pending review</span>
  </div>
  <button class="btn">Save changes</button>
  <button class="btn btn-danger">Delete</button>
</body></html>

<!-- single layout card — generated from Figma by scripts/build-templates.mjs.
     The outer element is the component's own class; everything inside is its Figma
     child tree. Do not hand-edit: regenerate with npm run build. -->
<div class="pf-single-layout-card">
  <div style="display:flex;flex-direction:row;align-items:center;justify-content:space-between">
    <div style="display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:10px">
      <div class="pf-circle-icons" data-size="S - 36px"></div><!-- Circle icons -->
      <span class="pf-text-sub-heading" style="color:var(--pf-text-primary)">Title</span>
    </div>
    <div style="display:flex;flex-direction:row;align-items:center;justify-content:flex-end;gap:10px">
      <div class="pf-button" data-type="Action" data-state="Default" data-label="Yes">Button</div>
      <div class="pf-button" data-type="Hollow" data-state="Default" data-label="Yes">Button</div>
      <!--pf-icon:context-menu 28-->
    </div>
  </div>
  <div style="display:flex;flex-direction:row;align-items:flex-end;justify-content:flex-start;gap:30px">
    <div class="pf-tab" data-system="People First" data-state="Selected" data-mobile="No" data-selected="Yes">Tab</div>
    <div class="pf-tab" data-system="People First" data-state="Default" data-mobile="No" data-selected="No">Tab</div>
    <div class="pf-tab" data-system="People First" data-state="Default" data-mobile="No" data-selected="No">Tab</div>
    <div class="pf-tab" data-system="People First" data-state="Default" data-mobile="No" data-selected="No">Tab</div>
    <div class="pf-tab" data-system="People First" data-state="Default" data-mobile="No" data-selected="No">Tab</div>
    <div class="pf-tab" data-system="People First" data-state="Default" data-mobile="No" data-selected="No">Tab</div>
  </div>
  <div class="pf-content-cards" data-mobile="false">Content cards</div>
  <div class="pf-empty-section" data-mobile="False">Empty section</div>
</div>

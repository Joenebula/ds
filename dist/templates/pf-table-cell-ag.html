<!-- Table cell (AG) — generated from Figma by scripts/build-templates.mjs.
     The outer element is the component's own class; everything inside is its Figma
     child tree. Do not hand-edit: regenerate with npm run build. -->
<div class="pf-table-cell-ag">
  <div style="display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:10px">
    <div class="pf-profile-image" data-size="Extra large" style="width:36px;height:36px;box-sizing:border-box"></div><!-- sized as Figma draws it HERE: Profile image is 36x36 inside Table cell (AG), not the Profile image artboard its class states. --><!-- Profile image -->
    <!--pf-icon:home 36-->
    <div class="pf-links" data-link-type="Secondary" data-hover="False" data-icon-position="Left" style="height:18px;box-sizing:border-box"></div><!-- sized as Figma draws it HERE: Links is 25x18 inside Table cell (AG), not the Links artboard its class states. --><!-- Links -->
    <div class="pf-tags" data-type="Expired" data-small="No">Tags</div>
    <div class="pf-toggle" data-on="Yes" data-locked="No">Toggle</div>
    <div class="pf-table-progress-bar" data-completion="50%" data-dark-cell-background="No" style="height:18px;box-sizing:border-box">Table progress bar</div><!-- sized as Figma draws it HERE: Table progress bar is 107x18 inside Table cell (AG), not the Table progress bar artboard its class states. -->
    <span class="pf-text-label-text-italic">Blank</span>
    <div style="border-radius:50px;background:var(--pf-bg-primary);box-shadow:inset 0 0 0 1px var(--pf-border-form-input);min-height:28px;width:28px"></div>
    <span class="pf-text-label-text" style="color:var(--pf-text-primary)">Text</span>
    <div style="display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:10px">
      <span class="pf-text-label-text" style="color:var(--pf-text-primary)">Option 1, Op</span>
      <span class="pf-text-label-text" style="color:var(--pf-text-link)">+4</span>
    </div>
    <span class="pf-text-label-text">Cell label</span>
  </div>
  <!--pf-icon:context-menu 20-->
</div>

<!--
  One button.

  Everything painted here comes from the design system. The page's own CSS centres it on
  the viewport and does nothing else — no size, no padding, no radius, no colour, no type.

  What the Figma component says (Button, 1656:44983, Type=Action, State=Default):

      107 x 32   padding 0 20   radius 20   gap 10   label 13px SemiBold   icon 16x16

  All of it is in `.pf-button`. The only thing this page chooses is which variant, which
  is what `data-type` is for.

  Open Sans is now shipped (assets/fonts/, inlined by dist/fonts.css). Before that,
  `--pf-font-body` resolved to DejaVu Sans and weight 600 snapped to DejaVu Bold, so a
  button specified as SemiBold rendered heavier and wider than the design — on this page
  and every other. scripts/check-fonts.mjs is the check that asks which face actually
  rendered, which is the question none of the others ask.
-->
<meta charset="utf-8">
<title>Button</title>
<style>
/*__TOKENS__*/
/*__COMPONENTS__*/
/*__TYPE__*/

/* pf-new: page shell. Centres the specimen; paints nothing. */
body { margin: 0; min-height: 100vh; display: grid; place-items: center;
       background: var(--pf-bg-secondary); }
.pf-button { cursor: pointer; }
</style>

<button class="pf-button" data-pf-id="action-button" data-type="Action" type="button"><!--pf-icon:add-plus 16-->Action</button>
